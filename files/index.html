<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LKS888</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"></head>
<body>
  <div class="app" id="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="เมนูหลัก">
      <div class="sidebar-head">
        <span class="brand">LKS888</span>
        <button class="icon-btn on-dark" id="sidebarClose" aria-label="ซ่อนเมนู">☰</button>
      </div>

      <nav class="modes">
        <button class="mode" data-mode="login" disabled>Login<small>เร็วๆ นี้</small></button>
        <div class="mode-sep" role="separator"></div>
        <button class="mode active" data-mode="chatbot" aria-current="page">Chatbot</button>
        <button class="mode" data-mode="recommend" disabled>แนะนำสายการเรียน<small>เร็วๆ นี้</small></button>
        <button class="mode" data-mode="stats">สถิติ</button>
      </nav>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn on-dark" id="sidebarOpen" aria-label="เปิดเมนู">☰</button>
        <h1>Chatbot</h1>
      </header>

      <!-- โหมด Chatbot (โหมดในอนาคตเพิ่ม <section class="view" data-view="..."> ได้ที่นี่) -->
      <section class="view" data-view="chatbot">
        <div class="chat" id="chat" role="log" aria-live="polite">
          <div class="welcome" id="welcome">
            <h2>ถามเรื่องการเลือกสายการเรียนได้เลย</h2>
            <p>ระบบจะค้นข้อมูลจากฐานข้อมูลของ LKS888 ให้</p>
            <div class="suggestions">
              <button class="chip" type="button">มีสายการเรียนอะไรบ้าง</button>
              <button class="chip" type="button">สายวิทย์-คณิตมีจุดเด่นอะไร</button>
              <button class="chip" type="button">มีวิชาเสริมอะไรให้เลือก</button>
            </div>
          </div>
        </div>

        <div class="composer">
          <form id="chatForm" autocomplete="off">
            <textarea id="input" rows="1" placeholder="พิมพ์ข้อความ" aria-label="พิมพ์ข้อความ" maxlength="1000"></textarea>
            <button class="send" id="send" type="submit" aria-label="ส่งข้อความ">ส่ง</button>
          </form>
        </div>
      </section>
      <!-- โหมดสถิติ -->
      <section class="view" data-view="stats" hidden>
        <div class="stats">
          <div class="tabs" role="tablist">
            <button class="tab active" role="tab" data-level="junior">มัธยมต้น</button>
            <button class="tab" role="tab" data-level="senior">มัธยมปลาย</button>
          </div>
          <div id="statsBody"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="grade-overlay" id="gradeOverlay" role="dialog" aria-modal="true" aria-labelledby="gradeTitle" hidden>
    <div class="grade-box">
      <h2 id="gradeTitle">เลือกระดับการศึกษา</h2>
      <p>เลือกเพื่อเริ่มถาม Chatbot</p>
      <div class="grade-options">
        <button class="grade-btn" type="button" data-grade="junior">ม.ต้น</button>
        <button class="grade-btn" type="button" data-grade="senior">ม.ปลาย</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script src="{{ url_for('static', filename='stats.js') }}"></script></body>
</html>
